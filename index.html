<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#020617">
  <title>Problem Solver Tool</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    body {
      background-color: #020617; /* slate-950 */
      margin: 0;
      overflow: hidden;
      overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
    }
    
    /* Ensure the root element takes exactly the dynamic height of the screen */
    #root {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Component } = React;

    // --- Error Boundary ---
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex flex-col items-center justify-center min-h-[100dvh] bg-slate-950 text-slate-200 p-8 font-sans">
              <div className="max-w-xl w-full bg-slate-900 border border-slate-700 p-8 rounded-2xl shadow-2xl text-center">
                <svg className="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <h2 className="text-2xl font-bold text-slate-100 mb-2">Workspace Conflict Detected</h2>
                <p className="text-slate-400 mb-6">Your browser's saved data is incompatible with the latest app update.</p>
                <button 
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="px-6 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium shadow-lg transition-colors"
                >
                  Clear Data & Reset Tool
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- UI Components ---
    const CheckIcon = ({ className }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
    );

    const QuestionBox = ({ children, theme = 'blue', checked = true, onCheck, interactive = false }) => {
      const themes = {
        blue: "border-blue-900/50 bg-blue-950/20 text-blue-100",
        gold: "border-amber-900/50 bg-amber-950/20 text-amber-100",
        neutral: "border-slate-700 bg-slate-800 text-slate-200"
      };
      const activeStyles = interactive ? checked ? "opacity-100" : "opacity-90 hover:opacity-100 cursor-pointer hover:bg-slate-800/50 border-dashed" : "";
      const iconColors = {
        blue: checked ? "text-blue-500" : "text-blue-800",
        gold: checked ? "text-amber-500" : "text-amber-800",
        neutral: checked ? "text-slate-400" : "text-slate-600"
      };

      return (
        <div className={`p-4 rounded-xl border transition-all duration-300 shadow-sm flex items-start gap-3 animate-fade-in ${themes[theme]} ${activeStyles}`} onClick={interactive && !checked ? onCheck : undefined}>
          {checked ? <CheckIcon className={`mt-0.5 h-5 w-5 flex-shrink-0 ${iconColors[theme]}`} /> : <div className={`mt-0.5 h-5 w-5 flex-shrink-0 rounded-full border-2 ${iconColors[theme]} border-current`} />}
          <span className="text-lg font-medium">{children}</span>
        </div>
      );
    };

    const Card = ({ children, theme = 'blue', className = '' }) => {
      const themeStyles = {
        blue: 'border-blue-900/40 bg-slate-900', gold: 'border-amber-900/40 bg-slate-900',
        red: 'border-red-900/40 bg-slate-900', neutral: 'border-slate-800 bg-slate-900'
      };
      return (
        <div className={`w-full max-w-3xl mx-auto rounded-2xl border shadow-lg p-6 md:p-10 transition-colors duration-500 ${themeStyles[theme]} ${className}`}>
          {children}
        </div>
      );
    };

    const Button = ({ children, onClick, variant = 'primary', theme = 'blue', className = '' }) => {
      const baseStyle = "inline-flex items-center justify-center px-6 py-3 border text-base font-medium rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all duration-200";
      const themes = {
        blue: { primary: "border-transparent text-white bg-blue-600 hover:bg-blue-700 shadow-[0_0_15px_rgba(37,99,235,0.3)]", secondary: "border-blue-800/50 text-blue-400 bg-blue-950/30 hover:bg-blue-900/50" },
        gold: { primary: "border-transparent text-slate-900 bg-amber-500 hover:bg-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]", secondary: "border-amber-900/50 text-amber-400 bg-amber-950/30 hover:bg-amber-900/50" },
        neutral: { primary: "border-transparent text-white bg-slate-700 hover:bg-slate-600", secondary: "border-slate-700 text-slate-300 bg-slate-800 hover:bg-slate-700" }
      };
      return <button onClick={onClick} className={`${baseStyle} ${themes[theme][variant] || themes.blue.primary} ${className}`}>{children}</button>;
    };

    const BulletInput = ({ label, value, onChange, placeholder, theme = 'blue' }) => {
      const [currentText, setCurrentText] = useState('');
      const items = Array.isArray(value) ? value : (value ? [value] : []);
      const themes = {
        blue: "bg-blue-950/30 border-blue-900/50 text-blue-100", gold: "bg-amber-950/30 border-amber-900/50 text-amber-100",
        red: "bg-red-950/30 border-red-900/50 text-red-100", neutral: "bg-slate-800 border-slate-700 text-slate-100"
      };

      const handleAdd = () => { if (currentText.trim()) { onChange([...items, currentText.trim()]); setCurrentText(''); } };
      const removeItem = (idx) => { const newItems = [...items]; newItems.splice(idx, 1); onChange(newItems); };

      return (
        <div className="space-y-3 mb-8 w-full animate-fade-in">
          {label && <QuestionBox theme={theme}>{label}</QuestionBox>}
          {items.length > 0 && (
            <ul className="space-y-2 mb-4 w-full">
              {items.map((item, idx) => (
                <li key={idx} className={`p-3 rounded-xl border flex justify-between items-start gap-3 shadow-sm ${themes[theme]}`}>
                  <span className="flex-1 mt-0.5 whitespace-pre-wrap break-words leading-relaxed">• {item}</span>
                  <button onClick={() => removeItem(idx)} className="text-slate-500 hover:text-red-400 mt-1 flex-shrink-0"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </li>
              ))}
            </ul>
          )}
          <div className="flex gap-2 items-end">
            <textarea rows={2} className="flex-1 p-4 bg-slate-800 border border-slate-700 text-slate-100 placeholder-slate-500 rounded-xl shadow-sm resize-y focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder={placeholder || "Type and press Enter..."} value={currentText} onChange={(e) => setCurrentText(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAdd(); } }} />
            <Button variant="secondary" theme={theme} onClick={handleAdd} className="mb-1">Add</Button>
          </div>
        </div>
      );
    };

    // --- Icons ---
    const ArrowRight = () => <svg className="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>;
    const Brain = () => <svg className="mr-2 -ml-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>;
    const MenuIcon = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>;
    const FolderIcon = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>;
    const FileIcon = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
    const EditIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;
    const CopyIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>;
    const ListIcon = ({ className = "w-5 h-5" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>;

    // --- Tour Component ---
    const TourOverlay = ({ active, stepIndex, steps, onClose, onNext, onPrev }) => {
      const [rect, setRect] = useState(null);
      useEffect(() => {
        if (!active || !steps[stepIndex]?.target) { setRect(null); return; }
        const updateRect = () => { const el = document.getElementById(steps[stepIndex].target); if (el) setRect(el.getBoundingClientRect()); };
        const timer = setTimeout(updateRect, 400); window.addEventListener('resize', updateRect);
        return () => { clearTimeout(timer); window.removeEventListener('resize', updateRect); };
      }, [active, stepIndex, steps]);

      if (!active) return null;
      const step = steps[stepIndex];
      const isCenter = !step.target || !rect;
      let tooltipStyle = { top: '50%', left: '50%', transform: 'translate(-50%, -50%)' };
      if (!isCenter) {
         const spaceRight = window.innerWidth - rect.right;
         const spaceBottom = window.innerHeight - rect.bottom;
         if (step.position === 'right' && spaceRight > 320) { tooltipStyle = { top: rect.top, left: rect.right + 20 }; } 
         else if (spaceBottom > 220) { tooltipStyle = { top: rect.bottom + 20, left: Math.max(16, Math.min(rect.left, window.innerWidth - 340)) }; } 
         else if (rect.top > 220) { tooltipStyle = { bottom: window.innerHeight - rect.top + 20, left: Math.max(16, Math.min(rect.left, window.innerWidth - 340)) }; }
      }

      return (
        <div className="fixed inset-0 z-[100] pointer-events-auto">
          {isCenter ? <div className="absolute inset-0 bg-slate-950/80 transition-opacity animate-fade-in" onClick={onClose} /> : 
            <div className="absolute transition-all duration-300 pointer-events-none rounded-xl ring-4 ring-blue-500" style={{ top: rect.top - 6, left: rect.left - 6, width: rect.width + 12, height: rect.height + 12, boxShadow: '0 0 0 9999px rgba(2, 6, 23, 0.85)' }} />
          }
          <div className="absolute bg-slate-800 border border-slate-700 shadow-[0_0_40px_rgba(0,0,0,0.5)] rounded-2xl p-6 w-[320px] transition-all duration-300 text-slate-100 z-[101]" style={tooltipStyle}>
             <h3 className="text-xl font-bold text-blue-400 mb-2 flex items-center gap-2">{step.title}</h3>
             <p className="text-slate-300 text-sm mb-6 leading-relaxed">{step.content}</p>
             <div className="flex justify-between items-center">
                <button onClick={onClose} className="text-slate-500 hover:text-slate-300 text-sm font-medium">Skip Tour</button>
                <div className="flex gap-2">
                   {stepIndex > 0 && <button className="px-3 py-1.5 rounded-lg bg-slate-700 text-slate-200 text-sm hover:bg-slate-600 transition-colors" onClick={onPrev}>Prev</button>}
                   {stepIndex < steps.length - 1 ? <button className="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-500 transition-colors font-medium" onClick={onNext}>Next</button> : <button className="px-3 py-1.5 rounded-lg bg-green-600 text-white text-sm hover:bg-green-500 transition-colors font-medium" onClick={onClose}>Finish</button>}
                </div>
             </div>
          </div>
        </div>
      );
    };

    // --- Todo Components ---
    const TodoInput = ({ onSubmit, placeholder, autoFocus }) => {
      const [text, setText] = useState('');
      return (
        <div className="flex gap-2 w-full">
          <input autoFocus={autoFocus} type="text" className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 placeholder-slate-500 outline-none focus:border-blue-500" placeholder={placeholder} value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && text.trim()) { onSubmit(text.trim()); setText(''); } }} />
          <button onClick={() => { if (text.trim()) { onSubmit(text.trim()); setText(''); } }} className="px-3 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-medium flex-shrink-0"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg></button>
        </div>
      );
    };

    const TodoItem = ({ node, onUpdate, onDelete, onAddChild, onMoveUp, onMoveDown, renderChildren, onDropItem }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [editValue, setEditValue] = useState(node.text);
      const [showAddChild, setShowAddChild] = useState(false);
      const [expanded, setExpanded] = useState(true);
      const [dropPos, setDropPos] = useState(null);
      const [copied, setCopied] = useState(false);

      const hasChildren = node.children && node.children.length > 0;

      return (
        <div className="border-l-2 border-slate-700/50 pl-4 py-2 my-2 transition-all">
          <div draggable onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData('todoId', node.id); }} onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); const rect = e.currentTarget.getBoundingClientRect(); const y = e.clientY - rect.top; if (y < rect.height * 0.25) setDropPos('before'); else if (y > rect.height * 0.75) setDropPos('after'); else setDropPos('inside'); }} onDragLeave={() => setDropPos(null)} onDrop={(e) => { e.preventDefault(); e.stopPropagation(); const draggedId = e.dataTransfer.getData('todoId'); if (draggedId && draggedId !== node.id && dropPos) { onDropItem(draggedId, node.id, dropPos); } setDropPos(null); }} className={`flex items-start gap-3 group p-2 -ml-2 rounded-xl transition-all ${dropPos === 'before' ? 'shadow-[0_-2px_0_#3b82f6]' : dropPos === 'after' ? 'shadow-[0_2px_0_#3b82f6]' : dropPos === 'inside' ? 'bg-blue-900/30' : ''}`}>
            <div className="cursor-grab text-slate-500 mt-1 opacity-30 lg:opacity-0 lg:group-hover:opacity-100 flex-shrink-0"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16"></path></svg></div>
            <button onClick={() => setExpanded(!expanded)} className={`mt-1 w-5 h-5 flex items-center justify-center flex-shrink-0 text-slate-500 hover:text-slate-300 ${!hasChildren && 'invisible'}`}>{expanded ? '▼' : '▶'}</button>
            <button onClick={() => onUpdate({ completed: !node.completed })} className={`mt-1 flex-shrink-0 w-5 h-5 rounded border-2 flex items-center justify-center transition-colors ${node.completed ? 'bg-green-500 border-green-500 text-slate-900' : 'border-slate-500 text-transparent hover:border-slate-400'}`}><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg></button>
            
            <div className="flex-1 min-w-0 flex flex-col">
              {isEditing ? (
                <textarea autoFocus className="bg-slate-900 border border-blue-500 rounded-lg px-3 py-2 w-full text-slate-200 outline-none resize-y min-h-[80px]" value={editValue} onChange={e => setEditValue(e.target.value)} onBlur={() => { onUpdate({ text: editValue }); setIsEditing(false); }} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onUpdate({ text: editValue }); setIsEditing(false); } }} />
              ) : (
                <div className={`py-0.5 select-text cursor-text text-base whitespace-pre-wrap leading-relaxed ${node.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>{node.text}</div>
              )}
              
              <div className="opacity-100 lg:opacity-0 lg:group-hover:opacity-100 flex flex-wrap items-center gap-1.5 mt-2 transition-opacity text-slate-400 bg-slate-900/80 p-1.5 rounded-lg border border-slate-700/60 self-start">
                <button onClick={async () => {
                  try {
                    let success = false;
                    if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(node.text); success = true; } catch (err) {} }
                    if (!success) { const textArea = document.createElement("textarea"); textArea.value = node.text; textArea.style.position = "fixed"; textArea.style.opacity = "0"; document.body.appendChild(textArea); textArea.focus(); textArea.select(); document.execCommand("copy"); textArea.remove(); }
                    setCopied(true); setTimeout(() => setCopied(false), 2000);
                  } catch (err) { console.error("Failed to copy", err); }
                }} className="p-1.5 hover:text-green-400 rounded flex items-center gap-1">
                   {copied ? <React.Fragment><svg className="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg><span className="text-xs text-green-500 font-bold">Copied!</span></React.Fragment> : <CopyIcon />}
                </button>
                <button onClick={() => setShowAddChild(!showAddChild)} className="p-1.5 hover:text-blue-400 rounded"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg></button>
                <button onClick={() => setIsEditing(true)} className="p-1.5 hover:text-amber-400 rounded"><EditIcon /></button>
                <button onClick={onMoveUp} className="p-1.5 hover:text-slate-200 rounded">↑</button>
                <button onClick={onMoveDown} className="p-1.5 hover:text-slate-200 rounded">↓</button>
                <button onClick={onDelete} className="p-1.5 hover:text-red-400 rounded"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
              </div>
            </div>
          </div>
          {showAddChild && <div className="ml-10 mt-2 mb-4 max-w-xl"><TodoInput autoFocus placeholder="New subtask..." onSubmit={(text) => { onAddChild(text); setShowAddChild(false); setExpanded(true); }} /></div>}
          {expanded && hasChildren && <div className="ml-6 mt-2 border-l border-slate-700/30 pl-2">{renderChildren(node.children)}</div>}
        </div>
      );
    };

    const TodoTree = ({ items, onChange }) => {
      const handleAdd = (parentId, text) => {
        if (!text.trim()) return;
        const newItem = { id: Math.random().toString(36).substring(2, 9), text, completed: false, children: [] };
        if (!parentId) { onChange([...items, newItem]); return; }
        const traverseAndAdd = (nodes) => nodes.map(node => node.id === parentId ? { ...node, children: [...(node.children || []), newItem] } : (node.children ? { ...node, children: traverseAndAdd(node.children) } : node));
        onChange(traverseAndAdd(items));
      };

      const handleUpdate = (id, updates) => {
        const traverseAndUpdate = (nodes) => nodes.map(node => node.id === id ? { ...node, ...updates } : (node.children ? { ...node, children: traverseAndUpdate(node.children) } : node));
        onChange(traverseAndUpdate(items));
      };

      const handleDelete = (id) => {
        const traverseAndDelete = (nodes) => nodes.filter(node => node.id !== id).map(node => node.children ? { ...node, children: traverseAndDelete(node.children) } : node);
        onChange(traverseAndDelete(items));
      };

      const handleMove = (id, direction) => {
        let moved = false;
        const traverseAndMove = (nodes) => {
          if (moved) return nodes;
          const idx = nodes.findIndex(n => n.id === id);
          if (idx !== -1) {
            if ((direction === -1 && idx > 0) || (direction === 1 && idx < nodes.length - 1)) {
              const newNodes = [...nodes]; const temp = newNodes[idx]; newNodes[idx] = newNodes[idx + direction]; newNodes[idx + direction] = temp; moved = true; return newNodes;
            }
            return nodes;
          }
          return nodes.map(node => ({ ...node, children: node.children ? traverseAndMove(node.children) : [] }));
        };
        const newItems = traverseAndMove(items);
        if (moved) onChange(newItems);
      };

      const handleDropItem = (draggedId, targetId, position) => {
        let draggedNode = null;
        const removeNode = (nodes) => { let result = []; for (let i = 0; i < nodes.length; i++) { if (nodes[i].id === draggedId) { draggedNode = nodes[i]; } else { result.push({ ...nodes[i], children: nodes[i].children ? removeNode(nodes[i].children) : [] }); } } return result; };
        let currentItems = removeNode(items);
        if (!draggedNode) return;
        const isDescendant = (node, idToCheck) => { if (node.id === idToCheck) return true; if (node.children) { for (let child of node.children) { if (isDescendant(child, idToCheck)) return true; } } return false; };
        if (isDescendant(draggedNode, targetId)) return;
        const insertNode = (nodes) => { let result = []; for (let i = 0; i < nodes.length; i++) { if (nodes[i].id === targetId) { if (position === 'before') { result.push(draggedNode); result.push(nodes[i]); } else if (position === 'after') { result.push(nodes[i]); result.push(draggedNode); } else if (position === 'inside') { result.push({ ...nodes[i], children: [...(nodes[i].children || []), draggedNode] }); } } else { result.push({ ...nodes[i], children: nodes[i].children ? insertNode(nodes[i].children) : [] }); } } return result; };
        onChange(insertNode(currentItems));
      };

      const renderNode = (node) => (
        <TodoItem key={node.id} node={node} onUpdate={(updates) => handleUpdate(node.id, updates)} onDelete={() => handleDelete(node.id)} onAddChild={(text) => handleAdd(node.id, text)} onMoveUp={() => handleMove(node.id, -1)} onMoveDown={() => handleMove(node.id, 1)} onDropItem={handleDropItem} renderChildren={(children) => children.map(child => renderNode(child))} />
      );

      return (
        <div className="space-y-2">
          {items.map((item) => renderNode(item))}
          {items.length === 0 && <div className="text-slate-500 italic mb-4">No tasks yet. Add one below to start your action plan.</div>}
          <div className="mt-6 pt-4 border-t border-slate-800"><TodoInput onSubmit={(text) => handleAdd(null, text)} placeholder="Add a new main to-do..." /></div>
        </div>
      );
    };

    // --- Main Application ---
    function ProblemSession({ session, onUpdateSession, onNewSession, activeTab, onTabChange }) {
      
      const defaultData = {
        typeOfSituation: null, worthEnergy: null, desiredState: [],
        criticalThinking: { why: [], inherited: [], inheritedFrom: [], worstCase: [], tradeOffs: [] },
        currentState: [], tension: [], gap: { differences: [], missing: [] }, obstacles: [],
        motive: { type: null, description: [] }, todos: []
      };
      
      const data = {
        ...defaultData, ...(session.data || {}),
        criticalThinking: { ...defaultData.criticalThinking, ...(session.data?.criticalThinking || {}) },
        motive: { ...defaultData.motive, ...(session.data?.motive || {}) },
        gap: { ...defaultData.gap, ...(session.data?.gap || {}) },
        todos: session.data?.todos || []
      };
      
      const step = session.step || 0;
      const subStep = session.subStep || 0;
      const isProblem = session.isProblem !== undefined ? session.isProblem : null;

      const updateData = (field, value) => onUpdateSession(session.id, { data: { ...data, [field]: value } });
      const updateMotive = (field, value) => updateData('motive', { ...data.motive, [field]: value });
      const updateCritical = (field, value) => updateData('criticalThinking', { ...data.criticalThinking, [field]: value });
      const updateGap = (field, value) => updateData('gap', { ...data.gap, [field]: value });
      const setStep = (val) => onUpdateSession(session.id, { step: val, subStep: 0 });
      const setSubStep = (val) => onUpdateSession(session.id, { subStep: val });
      const setIsProblem = (val) => onUpdateSession(session.id, { isProblem: val });

      const fmt = (val) => { const arr = Array.isArray(val) ? val : (val ? [val] : []); return arr.length > 0 ? arr.join('; ') : '...'; };
      const renderList = (val) => {
        const arr = Array.isArray(val) ? val : (val ? [val] : []);
        if (arr.length === 0) return <span className="italic text-slate-500">None specified</span>;
        if (arr.length === 1) return <span className="whitespace-pre-wrap">{arr[0]}</span>;
        return <ul className="space-y-1">{arr.map((item, i) => <li key={i} className="flex gap-2"><span className="text-slate-500">•</span><span className="whitespace-pre-wrap">{item}</span></li>)}</ul>;
      };

      const renderStep = () => {
        switch (step) {
          case 0: // Reality Check
            return (
              <Card theme="neutral" className="text-center py-16">
                <h1 className="text-4xl font-bold text-slate-100 mb-8">Reality Check</h1>
                <div className="space-y-4 mb-12 max-w-xl mx-auto text-left">
                  {subStep >= 0 && <div className="animate-fade-in"><QuestionBox theme="neutral" interactive checked={subStep > 0} onCheck={() => setSubStep(1)}>Does something feel off?</QuestionBox></div>}
                  {subStep >= 1 && <QuestionBox theme="neutral" interactive checked={subStep > 1} onCheck={() => setSubStep(2)}>Does this something feel like tension?</QuestionBox>}
                  {subStep >= 2 && <QuestionBox theme="neutral" interactive checked={subStep > 2} onCheck={() => setSubStep(3)}>Is there a perceived difference between where you are and where you want to be?</QuestionBox>}
                  {subStep >= 3 && <QuestionBox theme="neutral" interactive checked={subStep > 3} onCheck={() => setSubStep(4)}>Is reality different from what you want?</QuestionBox>}
                  {subStep >= 4 && (
                    <div className="space-y-3 animate-fade-in mt-4">
                      <QuestionBox theme="neutral" checked={!!data.typeOfSituation}>Is this an issue or an opportunity?</QuestionBox>
                      {!data.typeOfSituation && subStep === 4 && (
                        <div className="flex gap-4 ml-12 pb-2">
                          <Button variant="secondary" theme="neutral" onClick={() => { updateData('typeOfSituation', 'Issue'); setSubStep(5); }}>Issue</Button>
                          <Button variant="secondary" theme="neutral" onClick={() => { updateData('typeOfSituation', 'Opportunity'); setSubStep(5); }}>Opportunity</Button>
                        </div>
                      )}
                      {data.typeOfSituation && <div className="ml-12 text-slate-400 text-sm font-medium">Selected: <span className="text-slate-200">{data.typeOfSituation}</span></div>}
                    </div>
                  )}
                  {subStep >= 5 && (
                    <div className="space-y-3 animate-fade-in mt-4">
                      <QuestionBox theme="neutral" checked={data.worthEnergy !== null}>Is this worth my mental time and energy?</QuestionBox>
                      {data.worthEnergy === null && subStep === 5 && (
                        <div className="flex gap-4 ml-12 pb-2">
                          <Button variant="secondary" theme="neutral" onClick={() => { updateData('worthEnergy', true); setSubStep(6); }}>Yes, it is</Button>
                          <Button variant="secondary" theme="neutral" onClick={() => { updateData('worthEnergy', false); }}>No</Button>
                        </div>
                      )}
                      {data.worthEnergy === false && (
                        <div className="ml-12 mt-4 animate-fade-in bg-green-900/20 border border-green-800 text-green-400 p-6 rounded-xl">
                           <h3 className="text-xl font-bold mb-2">Rest Easy!</h3>
                           <p>If it's not worth your time and energy right now, it's best to let it go. Have a great day!</p>
                           <Button variant="secondary" theme="neutral" className="mt-6" onClick={() => updateData('worthEnergy', null)}>Reconsider</Button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
                {subStep >= 6 && data.worthEnergy && (
                  isProblem === false ? (
                    <div className="animate-fade-in bg-green-900/20 border border-green-800 text-green-400 p-6 rounded-xl">
                      <h3 className="text-xl font-bold mb-2">No problem!</h3>
                      <p>Everything seems to be exactly as it should be. Have a great day!</p>
                      <Button variant="secondary" theme="neutral" className="mt-6" onClick={() => { setIsProblem(null); setSubStep(5); }}>Go Back</Button>
                    </div>
                  ) : (
                    <div className="flex flex-col sm:flex-row gap-4 justify-center animate-fade-in">
                      <Button onClick={() => setStep(1)} theme="blue">Yes, there is a difference <ArrowRight /></Button>
                      <Button variant="secondary" theme="neutral" onClick={() => setIsProblem(false)}>No, everything is fine</Button>
                    </div>
                  )
                )}
              </Card>
            );

          case 1: // Desired State
            return (
              <Card theme="blue">
                <div className="flex items-center gap-2 mb-4"><span className="bg-blue-900/50 text-blue-400 border border-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Problem Solving</span></div>
                <h2 className="text-3xl font-bold text-slate-100 mb-6">The Desired State</h2>
                <div className="space-y-4 mb-6">
                  {subStep >= 0 && <QuestionBox theme="blue" interactive checked={subStep > 0} onCheck={() => setSubStep(1)}>What is your desired state?</QuestionBox>}
                  {subStep >= 1 && <QuestionBox theme="blue" interactive checked={subStep > 1} onCheck={() => setSubStep(2)}>What do you actually want?</QuestionBox>}
                </div>
                {subStep >= 2 && (
                  <div className="animate-fade-in">
                    <BulletInput theme="blue" placeholder="Describe your ideal scenario, outcome, or reality..." value={data.desiredState} onChange={(val) => updateData('desiredState', val)} />
                    <div className="flex flex-col sm:flex-row gap-4 justify-between items-center pt-6 mt-8 border-t border-slate-800">
                      <Button theme="gold" onClick={() => setStep(2)}><Brain /> Apply Critical Thinking</Button>
                      <Button theme="blue" onClick={() => setStep(3)}>Continue to Current State <ArrowRight /></Button>
                    </div>
                  </div>
                )}
              </Card>
            );

          case 2: // Critical Thinking
            return (
              <Card theme="gold">
                <div className="flex items-center gap-2 mb-4"><span className="bg-amber-900/50 text-amber-400 border border-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Critical Thinking</span></div>
                <h2 className="text-3xl font-bold text-amber-500 mb-4">Deep Dive: Desired State</h2>
                <div className="text-amber-200/80 mb-8 font-medium bg-amber-950/30 p-4 rounded-xl border border-amber-900/50"><div className="text-sm text-amber-600 mb-1">Desired State:</div>{renderList(data.desiredState)}</div>
                <div className="space-y-8">
                  {subStep >= 0 && <div className="animate-fade-in space-y-3"><BulletInput theme="gold" label="Why do you want this specifically?" value={data.criticalThinking.why} onChange={(val) => updateCritical('why', val)} />{subStep === 0 && <Button theme="gold" variant="secondary" onClick={() => setSubStep(1)}>Next Question</Button>}</div>}
                  {subStep >= 1 && <div className="animate-fade-in space-y-3"><BulletInput theme="gold" label="Is this something you wanted inherently, or is it something you inherited?" value={data.criticalThinking.inherited} onChange={(val) => updateCritical('inherited', val)} />{subStep === 1 && <Button theme="gold" variant="secondary" onClick={() => setSubStep(2)}>Next Question</Button>}</div>}
                  {subStep >= 2 && <div className="animate-fade-in space-y-3"><BulletInput theme="gold" label="If inherited, who did you inherit it from, and how did that person influence you?" value={data.criticalThinking.inheritedFrom} onChange={(val) => updateCritical('inheritedFrom', val)} />{subStep === 2 && <Button theme="gold" variant="secondary" onClick={() => setSubStep(3)}>Next Question</Button>}</div>}
                  {subStep >= 3 && <div className="animate-fade-in space-y-3"><BulletInput theme="gold" label="If you don't get it, what is the worst case scenario?" value={data.criticalThinking.worstCase} onChange={(val) => updateCritical('worstCase', val)} />{subStep === 3 && <Button theme="gold" variant="secondary" onClick={() => setSubStep(4)}>Next Question</Button>}</div>}
                  {subStep >= 4 && <div className="animate-fade-in space-y-3"><BulletInput theme="gold" label="If you do get it, what's going to happen? What are the trade-offs?" value={data.criticalThinking.tradeOffs} onChange={(val) => updateCritical('tradeOffs', val)} /></div>}
                </div>
                {subStep >= 4 && <div className="flex justify-end gap-4 pt-6 mt-8 border-t border-slate-800 animate-fade-in"><Button theme="gold" onClick={() => setStep(3)}>Save Insights & Continue <ArrowRight /></Button></div>}
              </Card>
            );

          case 3: // Current State
            return (
              <Card theme="blue">
                <div className="flex items-center gap-2 mb-4"><span className="bg-blue-900/50 text-blue-400 border border-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Problem Solving</span></div>
                <h2 className="text-3xl font-bold text-slate-100 mb-6">The Current State</h2>
                <div className="space-y-4 mb-6">{subStep >= 0 && <QuestionBox theme="blue" interactive checked={subStep > 0} onCheck={() => setSubStep(1)}>What is your current state right now?</QuestionBox>}</div>
                {subStep >= 1 && (
                  <div className="animate-fade-in space-y-4 mb-8">
                    <BulletInput theme="blue" placeholder="Describe your reality as it stands today..." value={data.currentState} onChange={(val) => updateData('currentState', val)} />
                    {subStep === 1 && <div className="flex justify-end"><Button variant="secondary" theme="blue" onClick={() => setSubStep(2)}>Save Current State</Button></div>}
                  </div>
                )}
                {subStep >= 2 && (
                  <div className="animate-fade-in mt-8 pt-8 border-t border-blue-900/50">
                    <div className="bg-blue-950/40 p-6 rounded-xl border border-blue-800/50 shadow-lg space-y-4">
                      <div className="flex items-center gap-2 mb-2"><span className="text-blue-400 font-bold text-sm tracking-wide uppercase">Emerging Tension</span></div>
                      {subStep >= 2 && <QuestionBox theme="blue" interactive checked={subStep > 2} onCheck={() => setSubStep(3)}>What tension emerges from this current state?</QuestionBox>}
                      {subStep >= 3 && <div className="animate-fade-in mt-4"><BulletInput theme="blue" placeholder="Describe the tension or conflict you're experiencing..." value={data.tension} onChange={(val) => updateData('tension', val)} /></div>}
                    </div>
                  </div>
                )}
                {subStep >= 3 && (
                  <div className="flex justify-between items-center pt-6 mt-8 border-t border-slate-800 animate-fade-in">
                    <Button variant="secondary" theme="blue" onClick={() => setStep(1)}>Back</Button>
                    <Button theme="blue" onClick={() => setStep(4)}>Continue to The Gap <ArrowRight /></Button>
                  </div>
                )}
              </Card>
            );

          case 4: // The Gap (NEW)
            return (
              <Card theme="blue">
                <div className="flex items-center gap-2 mb-4"><span className="bg-blue-900/50 text-blue-400 border border-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Problem Solving</span></div>
                <h2 className="text-3xl font-bold text-slate-100 mb-6">The Gap</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                  <div className="bg-blue-950/30 p-4 rounded-xl border border-blue-900/50 shadow-sm">
                    <h3 className="text-sm font-bold text-blue-400 uppercase tracking-wider mb-2">Desired State</h3>
                    <div className="text-slate-200 text-sm">{renderList(data.desiredState)}</div>
                  </div>
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Current State</h3>
                    <div className="text-slate-200 text-sm">{renderList(data.currentState)}</div>
                  </div>
                </div>

                <div className="space-y-4 mb-6">
                  <QuestionBox theme="blue" interactive checked={true}>
                    What is the gap between the two?
                  </QuestionBox>
                </div>

                <div className="animate-fade-in space-y-8">
                  <BulletInput 
                    theme="blue"
                    label="1.) What's different between the two?"
                    placeholder="Note the differences..."
                    value={data.gap.differences}
                    onChange={(val) => updateGap('differences', val)}
                  />
                  
                  <BulletInput 
                    theme="blue"
                    label="2.) What's missing from the current state relative to your desired state?"
                    placeholder="List what is missing..."
                    value={data.gap.missing}
                    onChange={(val) => updateGap('missing', val)}
                  />

                  {(data.gap.differences.length > 0 || data.gap.missing.length > 0) && (
                    <div className="bg-slate-800/80 p-6 rounded-xl border border-slate-700 mt-6 shadow-inner animate-fade-in">
                      <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Synthesized Gap</h3>
                      <p className="text-slate-200 text-lg leading-relaxed">
                        This is the gap: <strong className="text-blue-400 bg-blue-950/50 border border-blue-900/50 px-2 py-1 rounded">[{fmt([...data.gap.differences, ...data.gap.missing])}]</strong>
                      </p>
                    </div>
                  )}

                  <div className="flex justify-between items-center pt-6 mt-8 border-t border-slate-800">
                    <Button variant="secondary" theme="blue" onClick={() => setStep(3)}>Back</Button>
                    <Button theme="blue" onClick={() => setStep(5)}>Continue to Obstacles <ArrowRight /></Button>
                  </div>
                </div>
              </Card>
            );

          case 5: // Obstacles
            return (
              <Card theme="blue">
                <div className="flex items-center gap-2 mb-4"><span className="bg-blue-900/50 text-blue-400 border border-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Problem Solving</span></div>
                <h2 className="text-3xl font-bold text-slate-100 mb-6">Identifying Obstacles</h2>
                <div className="space-y-4 mb-6">
                  {subStep >= 0 && <QuestionBox theme="blue" interactive checked={subStep > 0} onCheck={() => setSubStep(1)}>What are the obstacles preventing immediate resolution?</QuestionBox>}
                  {subStep >= 1 && <QuestionBox theme="blue" interactive checked={subStep > 1} onCheck={() => setSubStep(2)}>What is preventing you from moving from your current state to the desired state?</QuestionBox>}
                </div>
                {subStep >= 2 && (
                  <div className="animate-fade-in">
                    <BulletInput theme="blue" placeholder="List the blockers, challenges, and missing resources..." value={data.obstacles} onChange={(val) => updateData('obstacles', val)} />
                    <div className="flex justify-between items-center pt-6 mt-8 border-t border-slate-800">
                      <Button variant="secondary" theme="blue" onClick={() => setStep(4)}>Back</Button>
                      <Button theme="blue" onClick={() => setStep(6)}>Continue to Motive <ArrowRight /></Button>
                    </div>
                  </div>
                )}
              </Card>
            );

          case 6: // Motive
            return (
              <Card theme={data.motive?.type === 'push' ? 'red' : data.motive?.type === 'pull' ? 'neutral' : 'blue'} className={data.motive?.type === 'pull' ? 'border-green-900/40 bg-slate-900' : ''}>
                <div className="flex items-center gap-2 mb-4"><span className="bg-blue-900/50 text-blue-400 border border-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">Problem Solving</span></div>
                <h2 className="text-3xl font-bold text-slate-100 mb-6">Motive & Incentive</h2>
                <div className="space-y-4 mb-6"><QuestionBox theme="blue" interactive checked={true}>Is your motive for wanting to solve this problem that you want the desired state (Pull) or you want to get away from the current state (Push)?</QuestionBox></div>
                <div className="flex flex-col sm:flex-row gap-4 mb-8">
                  <button onClick={() => updateMotive('type', 'pull')} className={`flex-1 p-4 rounded-xl border-2 transition-all text-left ${data.motive?.type === 'pull' ? 'border-green-500 bg-green-950/40 shadow-[0_0_15px_rgba(34,197,94,0.2)]' : 'border-slate-700 bg-slate-800 hover:border-green-700 hover:bg-green-950/20'} `}>
                    <div className="font-bold text-green-400 mb-1">Pull (Green)</div>
                    <div className="text-sm text-slate-300">I want to achieve the desired state.</div>
                  </button>
                  <button onClick={() => updateMotive('type', 'push')} className={`flex-1 p-4 rounded-xl border-2 transition-all text-left ${data.motive?.type === 'push' ? 'border-red-500 bg-red-950/40 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-700 bg-slate-800 hover:border-red-700 hover:bg-red-950/20'} `}>
                    <div className="font-bold text-red-400 mb-1">Push (Red)</div>
                    <div className="text-sm text-slate-300">I am getting away from the current state.</div>
                  </button>
                </div>
                {data.motive?.type === 'pull' && <div className="animate-fade-in mb-8"><BulletInput theme="neutral" label="Why do you want the desired state, and what do you aspire to achieve by getting it?" placeholder="Describe your aspirations and consequences of achieving it..." value={data.motive.description || []} onChange={(val) => updateMotive('description', val)} /></div>}
                {data.motive?.type === 'push' && <div className="animate-fade-in mb-8"><BulletInput theme="red" label="Why do you want to leave the current state, and what happens down the line if nothing changes?" placeholder="Describe what you are avoiding and the consequences of inaction..." value={data.motive.description || []} onChange={(val) => updateMotive('description', val)} /></div>}
                {data.motive?.type && (
                  <div className="flex justify-between items-center pt-6 mt-8 border-t border-slate-800 animate-fade-in">
                    <Button variant="secondary" theme="blue" onClick={() => setStep(5)}>Back</Button>
                    <Button theme="blue" onClick={() => setStep(7)}>Generate Dashboard <ArrowRight /></Button>
                  </div>
                )}
              </Card>
            );

          case 7: // Dashboard
            return (
              <Card theme="neutral" className="bg-slate-900 border-slate-800">
                <h2 className="text-3xl font-bold text-slate-100 mb-6 border-b border-slate-800 pb-4">Problem Summary Dashboard</h2>
                <div className="space-y-8 animate-fade-in">
                  {data.typeOfSituation && (
                    <div className="flex flex-wrap items-center gap-3 mb-2">
                      <span className={`px-4 py-2 rounded-lg border text-sm font-bold tracking-wide uppercase ${data.typeOfSituation === 'Issue' ? 'bg-red-950/40 border-red-900/50 text-red-400' : 'bg-green-950/40 border-green-900/50 text-green-400'}`}>Type: {data.typeOfSituation}</span>
                      {data.worthEnergy && <span className="px-4 py-2 rounded-lg border text-sm font-bold tracking-wide uppercase bg-blue-950/40 border-blue-900/50 text-blue-400">Mental Energy: Worth It</span>}
                    </div>
                  )}
                  <div className="bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-700 text-lg leading-relaxed text-slate-300">
                    The gap I'm perceiving is between this desired state <strong className="text-blue-400 bg-blue-950/50 border border-blue-900/50 px-2 py-1 rounded">[{fmt(data.desiredState)}]</strong> 
                    &nbsp;and this current state <strong className="text-blue-400 bg-blue-950/50 border border-blue-900/50 px-2 py-1 rounded">[{fmt(data.currentState)}]</strong>.
                    <br/><br/>
                    This means the gap is: <strong className="text-cyan-400 bg-cyan-950/50 border border-cyan-900/50 px-2 py-1 rounded">[{fmt([...data.gap.differences, ...data.gap.missing])}]</strong>,
                    which is creating because of this obstacle <strong className="text-red-400 bg-red-950/50 border border-red-900/50 px-2 py-1 rounded">[{fmt(data.obstacles)}]</strong>,
                    creating this type of tension: <strong className="text-amber-400 bg-amber-950/50 border border-amber-900/50 px-2 py-1 rounded">[{fmt(data.tension)}]</strong>.
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm"><h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Desired State</h3><div className="text-slate-200 font-medium">{renderList(data.desiredState)}</div></div>
                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-sm"><h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Current State</h3><div className="text-slate-200 font-medium">{renderList(data.currentState)}</div></div>
                  </div>
                  {data.motive?.type && (
                    <div className={`p-6 rounded-xl border shadow-sm ${data.motive.type === 'pull' ? 'bg-green-950/20 border-green-900/30' : 'bg-red-950/20 border-red-900/30'}`}>
                      <h3 className={`text-lg font-bold mb-3 flex items-center ${data.motive.type === 'pull' ? 'text-green-500' : 'text-red-500'}`}>Motive: {data.motive.type === 'pull' ? 'Pull (Working toward goal)' : 'Push (Escaping current state)'}</h3>
                      <div className={`text-base font-medium ${data.motive.type === 'pull' ? 'text-green-200' : 'text-red-200'}`}>{renderList(data.motive.description)}</div>
                    </div>
                  )}
                  {(data.criticalThinking.why?.length > 0 || data.criticalThinking.tradeOffs?.length > 0 || data.criticalThinking.inherited?.length > 0 || data.criticalThinking.inheritedFrom?.length > 0 || data.criticalThinking.worstCase?.length > 0) && (
                    <div className="bg-amber-950/20 p-6 rounded-xl border border-amber-900/30 shadow-sm">
                      <h3 className="text-lg font-bold text-amber-500 mb-4 flex items-center"><Brain /> Critical Thinking Insights</h3>
                      <ul className="space-y-4 text-amber-200/90">
                        {data.criticalThinking.why?.length > 0 && <li><strong className="block text-sm text-amber-600 mb-1">Why I want it:</strong> {renderList(data.criticalThinking.why)}</li>}
                        {data.criticalThinking.inherited?.length > 0 && <li><strong className="block text-sm text-amber-600 mb-1">Inherently or Inherited:</strong> {renderList(data.criticalThinking.inherited)}</li>}
                        {data.criticalThinking.inheritedFrom?.length > 0 && <li><strong className="block text-sm text-amber-600 mb-1">Inheritance influence:</strong> {renderList(data.criticalThinking.inheritedFrom)}</li>}
                        {data.criticalThinking.worstCase?.length > 0 && <li><strong className="block text-sm text-amber-600 mb-1">Worst Case Scenario:</strong> {renderList(data.criticalThinking.worstCase)}</li>}
                        {data.criticalThinking.tradeOffs?.length > 0 && <li><strong className="block text-sm text-amber-600 mb-1">Trade-offs:</strong> {renderList(data.criticalThinking.tradeOffs)}</li>}
                      </ul>
                    </div>
                  )}
                  <div className="flex justify-center pt-8"><Button theme="neutral" onClick={onNewSession}>Start New Session</Button></div>
                </div>
              </Card>
            );

          default:
            return null;
        }
      };

      return (
        <div className="min-h-full py-6 pb-40 px-4 max-w-7xl mx-auto">
          <div className="flex justify-center mb-8 border-b border-slate-800 max-w-3xl mx-auto overflow-x-auto">
            <button className={`px-6 py-3 font-medium border-b-2 transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'analysis' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`} onClick={() => onTabChange('analysis')}><Brain /> Problem Analysis</button>
            <button className={`px-6 py-3 font-medium border-b-2 transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'todos' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`} onClick={() => onTabChange('todos')}><ListIcon className="w-5 h-5" /> Action Plan</button>
          </div>
          
          {activeTab === 'analysis' && (
            <div className="w-full max-w-3xl mx-auto mb-6 px-2 animate-fade-in">
              <div className="flex flex-wrap items-center justify-center gap-2">
                {[
                  { id: 0, label: "1. Reality" },
                  { id: 1, label: "2. Desired" },
                  { id: 2, label: "Deep Dive", hidden: !data.criticalThinking.why?.length && step !== 2 },
                  { id: 3, label: "3. Current" },
                  { id: 4, label: "4. Gap" },
                  { id: 5, label: "5. Obstacles" },
                  { id: 6, label: "6. Motive" },
                  { id: 7, label: "7. Summary" }
                ].filter(s => !s.hidden).map(s => (
                  <button
                    key={s.id}
                    onClick={() => setStep(s.id)}
                    className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition-all ${
                      step === s.id 
                        ? (s.id === 2 ? 'bg-amber-600 border-amber-500 text-white shadow-md' : 'bg-blue-600 border-blue-500 text-white shadow-md')
                        : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                    title={`Jump to ${s.label}`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activeTab === 'todos' ? (
            <Card theme="neutral" className="max-w-5xl">
               <h2 className="text-3xl font-bold text-slate-100 mb-6">Action Plan</h2>
               <p className="text-slate-400 mb-8">Break down your solution into manageable, recursive tasks.</p>
               <TodoTree items={data.todos || []} onChange={(newTodos) => updateData('todos', newTodos)} />
            </Card>
          ) : renderStep()}
        </div>
      );
    }

    function WorkspaceApp() {
      // LocalStorage Syncing
      const [sessions, setSessions] = useState(() => { try { const saved = localStorage.getItem('problemSolver_sessions'); return saved ? JSON.parse(saved) : []; } catch (e) { return []; } });
      const [folders, setFolders] = useState(() => { try { const saved = localStorage.getItem('problemSolver_folders'); return saved ? JSON.parse(saved) : []; } catch (e) { return []; } });
      const [activeId, setActiveId] = useState(() => localStorage.getItem('problemSolver_activeId') || null);
      const [activeSessionTab, setActiveSessionTab] = useState(() => localStorage.getItem('problemSolver_activeTab') || 'analysis');
      const [sidebarOpen, setSidebarOpen] = useState(() => localStorage.getItem('problemSolver_sidebar') === 'true');
      const [editingItem, setEditingItem] = useState({ id: null, type: null, tempName: '' });

      // Save Data Everything instantly
      useEffect(() => { localStorage.setItem('problemSolver_sessions', JSON.stringify(sessions)); }, [sessions]);
      useEffect(() => { localStorage.setItem('problemSolver_folders', JSON.stringify(folders)); }, [folders]);
      useEffect(() => { if (activeId) { localStorage.setItem('problemSolver_activeId', activeId); } else { localStorage.removeItem('problemSolver_activeId'); } }, [activeId]);
      useEffect(() => { localStorage.setItem('problemSolver_activeTab', activeSessionTab); }, [activeSessionTab]);
      useEffect(() => { localStorage.setItem('problemSolver_sidebar', sidebarOpen); }, [sidebarOpen]);

      // Tutorial State
      const [isTourActive, setIsTourActive] = useState(false);
      const [tourStep, setTourStep] = useState(0);
      const TOUR_STEPS = [
        { target: null, title: "Welcome to Problem Solver", content: "This tool helps you deconstruct problems, apply critical thinking, and build actionable plans. Let's take a quick tour!" },
        { target: "tour-sidebar-toggle", title: "Sidebar Menu", content: "Toggle the sidebar to access your history, folders, and organize your workspace.", position: "bottom" },
        { target: "tour-fab-add", title: "Start a Session", content: "Click this floating button anytime to start a brand new problem-solving process.", position: "left" },
        { target: "tour-segments", title: "Control Segments", content: "Drag and drop your folders and problems into these segments.", position: "right", requiresSidebar: true },
      ];

      useEffect(() => {
        const hasSeenTour = localStorage.getItem('problemSolver_hasSeenTour');
        if (!hasSeenTour) { setTimeout(() => setIsTourActive(true), 500); localStorage.setItem('problemSolver_hasSeenTour', 'true'); }
      }, []);
      useEffect(() => { if (isTourActive && TOUR_STEPS[tourStep]?.requiresSidebar && !sidebarOpen) { setSidebarOpen(true); } }, [isTourActive, tourStep]);

      const SEGMENTS = [
        { id: 'none', label: 'Uncategorized', color: 'text-slate-400', bg: 'bg-transparent', border: 'border-transparent' },
        { id: 'control', label: 'Within My Control', color: 'text-emerald-400', bg: 'bg-emerald-950/10', border: 'border-emerald-900/30' },
        { id: 'influence', label: 'Within My Influence', color: 'text-blue-400', bg: 'bg-blue-950/10', border: 'border-blue-900/30' },
        { id: 'no-control', label: 'Out of My Control', color: 'text-red-400', bg: 'bg-red-950/10', border: 'border-red-900/30' },
      ];

      const createNewProblem = () => {
        const newSession = {
          id: Math.random().toString(36).substring(2, 9), title: 'New Problem ' + (sessions.length + 1),
          folderId: null, segment: 'none', step: 0, subStep: 0, isProblem: null,
          data: { typeOfSituation: null, worthEnergy: null, desiredState: [], criticalThinking: { why: [], inherited: [], inheritedFrom: [], worstCase: [], tradeOffs: [] }, currentState: [], gap: { differences: [], missing: [] }, tension: [], obstacles: [], motive: { type: null, description: [] }, todos: [] }
        };
        setSessions([newSession, ...sessions]);
        setActiveId(newSession.id);
        setActiveSessionTab('analysis');
      };

      const createNewFolder = () => setFolders([...folders, { id: Math.random().toString(36).substring(2, 9), name: 'New Folder ' + (folders.length + 1), segment: 'none' }]);
      const handleUpdateSession = (id, newState) => setSessions(prev => prev.map(s => s.id === id ? { ...s, ...newState } : s));
      const handleDragStart = (e, type, id) => { e.dataTransfer.setData('dragType', type); e.dataTransfer.setData('dragId', id); };
      const handleDropOnFolder = (e, folderId) => { e.preventDefault(); e.stopPropagation(); const dragType = e.dataTransfer.getData('dragType'); const dragId = e.dataTransfer.getData('dragId'); if (dragType === 'session') { setSessions(prev => prev.map(s => s.id === dragId ? { ...s, folderId } : s)); } };
      const handleDropOnSegment = (e, segmentId) => { e.preventDefault(); const dragType = e.dataTransfer.getData('dragType'); const dragId = e.dataTransfer.getData('dragId'); if (dragType === 'folder') { setFolders(prev => prev.map(f => f.id === dragId ? { ...f, segment: segmentId } : f)); } else if (dragType === 'session') { setSessions(prev => prev.map(s => s.id === dragId ? { ...s, folderId: null, segment: segmentId } : s)); } };
      
      const saveEditing = () => {
        if (!editingItem.id) return;
        if (editingItem.type === 'folder') setFolders(f => f.map(x => x.id === editingItem.id ? { ...x, name: editingItem.tempName || 'Unnamed Folder' } : x));
        else setSessions(s => s.map(x => x.id === editingItem.id ? { ...x, title: editingItem.tempName || 'Unnamed Problem' } : x));
        setEditingItem({ id: null, type: null, tempName: '' });
      };

      const activeSession = sessions.find(s => s.id === activeId);

      const renderSessionItem = (session) => (
        <div key={session.id} draggable onDragStart={e => handleDragStart(e, 'session', session.id)} onClick={() => { setActiveId(session.id); setActiveSessionTab('analysis'); }} className={`group flex items-center justify-between p-2 rounded-lg cursor-pointer transition-colors ${activeId === session.id ? 'bg-blue-900/40 border-blue-800/50' : 'hover:bg-slate-800/50 border-transparent'} border`}>
          <div className="flex items-center gap-2 flex-1 min-w-0">
            <FileIcon className={`w-4 h-4 flex-shrink-0 ${activeId === session.id ? 'text-blue-400' : 'text-slate-500'}`} />
            {editingItem.id === session.id ? <input autoFocus className="bg-slate-900 border border-blue-500 rounded px-2 py-0.5 w-full text-slate-200 text-sm outline-none" value={editingItem.tempName} onChange={e => setEditingItem({...editingItem, tempName: e.target.value})} onBlur={saveEditing} onKeyDown={e => e.key === 'Enter' && saveEditing()} /> : (
              <div className="flex items-center gap-2 truncate">
                <span className={`text-sm truncate select-none ${activeId === session.id ? 'text-blue-100 font-medium' : 'text-slate-400'}`}>{session.title}</span>
                {session.data?.motive?.type === 'pull' && <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-green-900/50 text-green-400 border border-green-800 flex-shrink-0">PULL</span>}
                {session.data?.motive?.type === 'push' && <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-red-900/50 text-red-400 border border-red-800 flex-shrink-0">PUSH</span>}
              </div>
            )}
          </div>
          <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
            <button onClick={(e) => { e.stopPropagation(); setActiveId(session.id); setActiveSessionTab('todos'); }} className="text-slate-500 hover:text-blue-400 p-1 rounded" title="Open Action Plan (To-Dos)"><ListIcon className="w-4 h-4" /></button>
            <button onClick={(e) => { e.stopPropagation(); setEditingItem({ id: session.id, type: 'session', tempName: session.title }); }} className="text-slate-500 hover:text-slate-300 p-1 rounded" title="Rename"><EditIcon /></button>
          </div>
        </div>
      );

      return (
        <div className="flex flex-col sm:flex-row h-full w-full bg-slate-950 font-sans text-slate-100 overflow-hidden relative">
          <TourOverlay active={isTourActive} stepIndex={tourStep} steps={TOUR_STEPS} onClose={() => setIsTourActive(false)} onNext={() => setTourStep(s => s + 1)} onPrev={() => setTourStep(s => s - 1)} />
          
          {/* Sidebar */}
          <div className={`absolute sm:relative z-40 sm:z-auto h-full flex-shrink-0 bg-slate-900 transition-transform sm:transition-[width] duration-300 ease-in-out border-r border-slate-800 shadow-2xl sm:shadow-none ${sidebarOpen ? 'translate-x-0 w-80' : '-translate-x-full sm:translate-x-0 sm:w-0 sm:border-none'}`}>
            <div className="w-80 flex flex-col h-full flex-shrink-0">
              <div className="p-4 w-full flex-shrink-0 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                <Button variant="secondary" theme="neutral" onClick={createNewFolder} className="w-full justify-start py-2.5 border-dashed border-slate-700 text-slate-400 hover:text-slate-300">
                  <FolderIcon className="w-5 h-5 mr-2 -ml-1" /> New Folder
                </Button>
                {/* Mobile close button inside sidebar */}
                <button onClick={() => setSidebarOpen(false)} className="sm:hidden ml-4 p-2 text-slate-400 hover:text-white">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
              </div>
              
              <div className="flex-1 overflow-y-auto p-4 pb-20 custom-scrollbar" id="tour-segments">
                {SEGMENTS.map(segment => (
                  <div key={segment.id} className={`mb-6 p-3 rounded-xl border border-dashed ${segment.border} ${segment.bg} min-h-[120px] transition-colors`} onDragOver={e => e.preventDefault()} onDrop={e => handleDropOnSegment(e, segment.id)}>
                    <div className={`text-xs font-bold uppercase tracking-wider mb-4 px-1 select-none flex items-center gap-2 ${segment.color}`}>{segment.label}</div>
                    {folders.filter(f => (f.segment || 'none') === segment.id).map(folder => (
                      <div key={folder.id} className="mb-3" draggable onDragStart={e => handleDragStart(e, 'folder', folder.id)}>
                        <div className="flex items-center justify-between p-2 rounded-lg bg-slate-800/80 border border-slate-700 hover:border-slate-600 transition-colors shadow-sm cursor-grab active:cursor-grabbing" onDragOver={e => e.preventDefault()} onDrop={e => handleDropOnFolder(e, folder.id)}>
                          <div className="flex items-center gap-2 flex-1 min-w-0">
                            <FolderIcon className="w-5 h-5 text-amber-500 flex-shrink-0" />
                            {editingItem.id === folder.id ? <input autoFocus className="bg-slate-900 border border-blue-500 rounded px-2 py-0.5 w-full text-slate-200 text-sm outline-none" value={editingItem.tempName} onChange={e => setEditingItem({...editingItem, tempName: e.target.value})} onBlur={saveEditing} onKeyDown={e => e.key === 'Enter' && saveEditing()} /> : <span className="text-slate-300 font-medium text-sm truncate select-none">{folder.name}</span>}
                          </div>
                          <button onClick={(e) => { e.stopPropagation(); setEditingItem({ id: folder.id, type: 'folder', tempName: folder.name }); }} className="text-slate-500 hover:text-slate-300 p-1"><EditIcon /></button>
                        </div>
                        <div className="pl-4 mt-2 border-l-2 border-slate-800/60 ml-2.5 space-y-1">
                          {sessions.filter(s => s.folderId === folder.id).map(renderSessionItem)}
                          {sessions.filter(s => s.folderId === folder.id).length === 0 && <div className="text-xs text-slate-600 italic px-2 py-1 select-none">Empty folder...</div>}
                        </div>
                      </div>
                    ))}
                    <div className="space-y-1">{sessions.filter(s => s.folderId === null && (s.segment || 'none') === segment.id).map(renderSessionItem)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
          
          {/* Mobile sidebar backdrop overlay */}
          {sidebarOpen && (
            <div className="sm:hidden fixed inset-0 bg-slate-950/60 z-30" onClick={() => setSidebarOpen(false)} />
          )}

          {/* Main Content Area */}
          <div className="flex-1 flex flex-col min-w-0 h-full relative bg-slate-950 z-10">
            <header className="flex-shrink-0 p-4 flex items-center gap-4 border-b border-slate-800/50 bg-slate-900/20 shadow-sm">
              <button id="tour-sidebar-toggle" onClick={() => setSidebarOpen(!sidebarOpen)} className="p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-400 hover:text-white shadow-sm transition-colors" title="Toggle Sidebar"><MenuIcon /></button>
              <h1 className="text-xl font-bold text-slate-200 truncate">Workspace</h1>
            </header>

            <main className="flex-1 overflow-y-auto custom-scrollbar relative pb-10">
              {activeSession ? (
                <ProblemSession key={activeSession.id} session={activeSession} onUpdateSession={handleUpdateSession} onNewSession={createNewProblem} activeTab={activeSessionTab} onTabChange={setActiveSessionTab} />
              ) : (
                <div className="flex items-center justify-center h-full min-h-[60vh]">
                  <div className="text-center animate-fade-in max-w-lg p-6">
                    <div className="w-20 h-20 bg-slate-800 text-slate-300 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner border border-slate-700"><Brain /></div>
                    <h2 className="text-4xl font-bold text-slate-100 mb-6">What are we solving today?</h2>
                    <p className="text-lg text-slate-300 mb-10 leading-relaxed">Using <span className="text-blue-400 font-semibold">problem solving</span>, <span className="text-amber-400 font-semibold">critical thinking</span>, and <span className="text-red-400 font-semibold">adaptability</span> skills.</p>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Floating Action Buttons */}
          <div className="fixed bottom-6 sm:bottom-8 right-5 sm:right-6 flex flex-col gap-3 z-[90]">
            <button id="tour-fab-add" onClick={createNewProblem} className="w-14 h-14 bg-blue-600 hover:bg-blue-500 text-white rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(37,99,235,0.4)] transition-transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-blue-500" title="New Problem">
              <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
            </button>
            <button onClick={() => { setIsTourActive(true); setTourStep(0); }} className="w-14 h-14 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-blue-400 rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(0,0,0,0.4)] transition-transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-slate-500" title="Help & Tour">
              <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <WorkspaceApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
